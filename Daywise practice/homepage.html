<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .container{
            text-align:center;
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }
        h1{
            margin-bottom:20px;
        }
        .login-btn{
            padding:12px 25px;
            font-size:16px;
            border:none;
            background:#4facfe;
            color:white;
            border-radius:5px;
            cursor:pointer;
            text-decoration:none;
        }
        .login-btn:hover{
            background:#008cff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Library Management System</h1>
        <p>Please login to continue</p>
        <a href="login.html" class="login-btn">Login</a>
    </div>

</body>
</html>
