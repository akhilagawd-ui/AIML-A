<!DOCTYPE html>
<html>
<head>
    <title>Library Login</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: url("library.jpg") no-repeat center center/cover;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .overlay{
            position:absolute;
            height:100%;
            width:100%;
            background: rgba(0,0,0,0.65);
        }

        .login-box{
            position:relative;
            width:370px;
            padding:30px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius:12px;
            color:white;
        }

        .login-box h2{
            text-align:center;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:12px;
        }

        input, select{
            width:100%;
            padding:8px;
            margin-top:5px;
            border:none;
            border-radius:6px;
        }

        .options{
            display:flex;
            justify-content:space-between;
            margin-top:10px;
            font-size:14px;
        }

        .login-btn{
            width:100%;
            padding:10px;
            margin-top:15px;
            border:none;
            border-radius:6px;
            background: linear-gradient(to right,#00c6ff,#0072ff);
            color:white;
            font-size:16px;
        }

        .extra-info{
            margin-top:18px;
            font-size:14px;
            text-align:center;
            line-height:1.6;
        }

        .extra-info a{
            color:#00ffff;
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="login-box">
    <h2>Login</h2>

    <form action="login.html">
        <label>Username</label>
        <input type="text" placeholder="Enter your username" required>

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <label>Select Role</label>
        <select required>
            <option value="">Choose Role</option>
            <option>Admin</option>
            <option>Librarian</option>
            <option>Faculty</option>
            <option>Student</option>
        </select>

        <div class="options">
            <label><input type="checkbox"> Remember</label>
            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn">Login</button>
    </form>

    <div class="extra-info">
        <p>New User? <a href="#">Register Here</a></p>
        <p>Library Timings: 8:00 AM – 8:00 PM</p>
        <p>Email: centrallibrary@email.com</p>
        <p>Phone: +91 9876543210</p>
    </div>
</div>

</body>
</html>
